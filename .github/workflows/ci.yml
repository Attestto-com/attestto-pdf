name: CI

# Every branch and every pull request. A trigger covering only the last hop
# into main is not a gate: with `branches: [main, develop]` a PR based on any
# other branch ran NO JOB AT ALL, so every step below was skipped rather than
# failed, which is the cheapest way to disable a whole pipeline without
# touching a single step. gate-self-test asserts this.
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The changelog gate needs a merge base with the target branch, and
          # the default depth-1 checkout does not have one.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Runs before the gates it vouches for: it seeds a violation of each one
      # and requires a non-zero exit. Every blocker in the 2026-08-11 audit was
      # a control that existed and had never executed, so "the step is present"
      # stopped counting as evidence. See scripts/gate-self-test.mjs.
      - name: Gate self-test
        run: npm run gate-self-test

      - name: Changelog gate
        run: node scripts/ci-changelog.mjs

      # Was `continue-on-error: true`, on the grounds that ESLint flat config
      # was not set up yet. It never was, so lint exited 2 on every run for the
      # life of the repo and the annotation read as a known-yellow rather than
      # as "this step cannot fail the build". Config now exists and this is
      # blocking.
      - name: Lint
        run: npm run lint

      - name: Type-check (src, including the Vue SFCs)
        run: npm run typecheck

      # Type-checks the tests, which tsconfig.json excludes. Without this pass
      # a type error inside a spec is invisible.
      - name: Type-check (src + tests)
        run: npx vue-tsc --noEmit -p tsconfig.test.json

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
